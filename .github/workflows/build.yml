{
 "name": "Build VST3",
 "on": ["push", "workflow_dispatch"],
 "jobs": {
  "build": {
   "strategy": {"fail-fast": false, "matrix": {"os": ["windows-latest", "macos-latest"]}},
   "runs-on": "${{ matrix.os }}",
   "defaults": {"run": {"shell": "bash"}},
   "steps": [
    {"uses": "actions/checkout@v4"},
    {"name": "Configure", "run": "cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=\"arm64;x86_64\""},
    {"name": "Build", "run": "cmake --build build --config Release"},
    {"name": "Upload VST3", "uses": "actions/upload-artifact@v4", "with": {"name": "TrapPadLab-VST3-${{ matrix.os }}", "path": "build/TrapPadLab_artefacts/Release/VST3\nbuild/TrapPadLab_artefacts/VST3"}}
   ]
  }
 }
}
